; Sensor de temperatura Wi-Fi de ultra baixo consumo
; Placa alvo: ESP32-C3 (módulo ESP32-C3-MINI-1 ou placa compatível)

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Descomente para ver logs pela USB nativa do C3 (gasta mais energia)
    ; -DDEPURACAO=1
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1
